kind = "mobile"
previewPath = "/"
title = "TradiQs AI"
description = "A high-end, gamified trading terminal mobile app. Features a Trading Floor with simulated balance, drawdown risk indicators, and buy/sell execution, plus AI Signals and Leaderboard tabs."
version = "1.0.0"
id = "artifacts/tradiqs-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18130

[services.development]
run = "pnpm --filter @workspace/tradiqs-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradiqs-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tradiqs-ai", "run", "serve" ]

[services.env]
PORT = "18130"
BASE_PATH = "/"
