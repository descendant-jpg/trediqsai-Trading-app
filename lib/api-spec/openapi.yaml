openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: AI trading signals
  - name: leaderboard
    description: Trader leaderboard
  - name: oracle
    description: TradiQs Oracle AI chat
paths:
  /oracle/chat:
    post:
      operationId: sendOracleChat
      tags: [oracle]
      summary: Send a chat message to the TradiQs Oracle AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OracleChatRequest"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OracleChatResponse"
        "503":
          description: AI backend unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OracleChatError"
  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: List AI trading signals
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: List leaderboard traders
      responses:
        "200":
          description: Ranked list of traders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trader"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Signal:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        action:
          type: string
          enum: [BUY, SELL]
        confidence:
          type: number
        price:
          type: string
        target:
          type: string
        stopLoss:
          type: string
        status:
          type: string
          enum: [ACTIVE, WON, LOST]
        timeframe:
          type: string
        time:
          type: string
        pro:
          type: boolean
        rationale:
          type: string
      required:
        - id
        - symbol
        - name
        - action
        - confidence
        - price
        - target
        - stopLoss
        - status
        - timeframe
        - time
        - pro
        - rationale
    Trader:
      type: object
      properties:
        id:
          type: string
        rank:
          type: number
        name:
          type: string
        handle:
          type: string
        pnl:
          type: number
        pnlPct:
          type: number
        winRate:
          type: number
        trades:
          type: number
        pro:
          type: boolean
      required:
        - id
        - rank
        - name
        - handle
        - pnl
        - pnlPct
        - winRate
        - trades
        - pro
    OracleChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    OracleTradingContext:
      type: object
      description: >-
        Snapshot of the caller's simulated trading account, used to
        personalise Oracle answers. All monetary values are USD.
      properties:
        balance:
          type: number
        equity:
          type: number
        openPosition:
          type: object
          nullable: true
          properties:
            side:
              type: string
              enum: [LONG, SHORT]
            symbol:
              type: string
            entryPrice:
              type: number
            size:
              type: number
            unrealizedPnl:
              type: number
          required:
            - side
            - symbol
            - entryPrice
            - size
            - unrealizedPnl
        drawdownUsed:
          type: number
          description: Fraction (0-1) of the daily drawdown limit consumed.
        distanceToPayout:
          type: number
          description: Dollars of profit still needed to reach payout.
      required:
        - balance
        - equity
        - drawdownUsed
        - distanceToPayout
    OracleChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/OracleChatMessage"
        tradingContext:
          $ref: "#/components/schemas/OracleTradingContext"
      required:
        - messages
    OracleChatResponse:
      type: object
      properties:
        reply:
          type: string
      required:
        - reply
    OracleChatError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
